name: 'sccache with Turbo Cache'
description: 'Start sccache with a WebDAV→Turbo proxy for per-crate Rust compilation caching. Call with mode=start before builds and mode=stop after. Requires TURBO_API, TURBO_TOKEN, and TURBO_TEAM env vars to be set at the workflow level.'
inputs:
  mode:
    description: '"start" to launch proxy + sccache, "stop" to print stats and shut down'
    required: true
  base-dir:
    description: 'SCCACHE_BASE_DIR for path normalization (default: $GITHUB_WORKSPACE)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install sccache
      if: ${{ inputs.mode == 'start' }}
      uses: taiki-e/install-action@v2
      with:
        tool: sccache@0.14.0

    - name: Set sccache env vars
      if: ${{ inputs.mode == 'start' }}
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_WEBDAV_ENDPOINT=http://127.0.0.1:${SCCACHE_TURBO_PROXY_PORT:-18080}" >> $GITHUB_ENV
        echo "SCCACHE_WEBDAV_KEY_PREFIX=sccache-v1" >> $GITHUB_ENV
        echo "SCCACHE_BASE_DIR=${{ inputs.base-dir || github.workspace }}" >> $GITHUB_ENV
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
        echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
        # Override the linker with our caching wrapper.
        # Use cargo rustflags to get ALL resolved flags (config.toml + env),
        # then append our linker override. This preserves --cfg=tokio_unstable
        # and other flags from .cargo/config.toml that RUSTFLAGS would clobber.
        CACHED_LINKER="${{ github.workspace }}/scripts/cached-linker"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          CACHED_LINKER="${{ github.workspace }}/scripts/cached-linker.cmd"
        fi

        # Get all resolved flags (one per line) and extract the real linker.
        # cargo rustflags --list merges .cargo/config.toml + env RUSTFLAGS.
        RESOLVED_FLAGS=$(cargo rustflags --list 2>/dev/null || echo "")
        REAL_LINKER=$(echo "$RESOLVED_FLAGS" | grep '^-Clinker=' | tail -1 | sed 's/^-Clinker=//' || echo "")
        echo "CACHED_LINKER_REAL=${REAL_LINKER}" >> $GITHUB_ENV

        # Join flags back into a single line, append our linker override.
        JOINED_FLAGS=$(echo "$RESOLVED_FLAGS" | tr '\n' ' ')
        echo "RUSTFLAGS=${JOINED_FLAGS}-Clinker=${CACHED_LINKER}" >> $GITHUB_ENV

    - name: Start sccache proxy
      if: ${{ inputs.mode == 'start' }}
      shell: bash
      run: |
        # Start proxy in background. It reads TURBO_API/TURBO_TOKEN/TURBO_TEAM
        # from the environment (set at the workflow level). Prints READY on
        # stdout when healthy and listening. Anything else means failure.
        PIDFILE=${RUNNER_TEMP}/sccache-turbo-proxy.pid
        READYFILE=${RUNNER_TEMP}/sccache-turbo-proxy.ready

        node scripts/memcache-turbo-proxy.js > "$READYFILE" &
        PROXY_PID=$!
        echo $PROXY_PID > "$PIDFILE"

        # Wait for first line of stdout or process exit
        for i in $(seq 1 30); do
          [ -s "$READYFILE" ] && break
          kill -0 $PROXY_PID 2>/dev/null || break
          sleep 1
        done

        if [ "$(head -1 "$READYFILE" 2>/dev/null)" = "READY" ]; then
          echo "sccache-turbo-proxy started (pid $PROXY_PID)"
        else
          echo "sccache-turbo-proxy failed to start:"
          cat "$READYFILE" 2>/dev/null || echo "(no output)"
          exit 1
        fi

    - name: Start sccache server
      if: ${{ inputs.mode == 'start' }}
      shell: bash
      run: |
        sccache --start-server 2>&1 || echo "sccache server may already be running"
        sccache --show-stats 2>&1 | grep "Cache location"

    - name: Stop sccache + show stats
      if: ${{ inputs.mode == 'stop' }}
      shell: bash
      run: |
        echo "=== sccache stats ==="
        sccache --show-stats || true
        sccache --stop-server 2>/dev/null || true

        # Stop the proxy (sends SIGTERM which triggers log dump)
        if [ -f ${RUNNER_TEMP}/sccache-turbo-proxy.pid ]; then
          kill $(cat ${RUNNER_TEMP}/sccache-turbo-proxy.pid) 2>/dev/null || true
          sleep 1
          rm -f ${RUNNER_TEMP}/sccache-turbo-proxy.pid
        fi
        # Show proxy log summary
        if [ -f ${RUNNER_TEMP}/sccache-turbo-proxy.log ]; then
          LOGF=${RUNNER_TEMP}/sccache-turbo-proxy.log
          echo "=== proxy log: method summary ==="
          sed 's/^[^ ]* //' "$LOGF" | cut -d' ' -f1 | sort | uniq -c | sort -rn || true
          echo "=== proxy log: GET results ==="
          grep ' GET ' "$LOGF" | sed 's/.* -> //' | sort | uniq -c | sort -rn || true
        fi
